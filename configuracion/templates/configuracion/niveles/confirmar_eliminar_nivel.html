{% extends 'principal/base.html' %}

{% block page_title %}
Confirmar Eliminación de Nivel
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="alert alert-danger text-center" role="alert">
                <i class="fas fa-exclamation-triangle fa-2x mb-3"></i>
                <h4>¡Advertencia!</h4>
                <p>Estás a punto de eliminar el Nivel <strong>{{ Nivel.NombreNivel }}</strong>.</p>
                <p>Esta acción es irreversible. ¿Estás seguro?</p>
            </div>
            <div class="d-flex justify-content-around mt-4">
                <form action="{% url 'configuracion:eliminar_nivel' Nivel.NombreNivel %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg me-2">Sí, Eliminar</button>
                </form>
                <a href="{% url 'configuracion:listar_niveles' %}" class="btn btn-secondary btn-lg">Cancelar</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
