{% extends 'principal/base.html' %}
{% load crispy_forms_tags %}

{% block page_title %}
Crear Nuevo Nivel
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="dashboard-card p-4">
                <h2 class="mb-4 text-center">Crear Nuevo Nivel</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Guardar Nivel</button>
                    <a href="{% url 'configuracion:listar_niveles' %}" class="btn btn-outline-secondary w-100 mt-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
