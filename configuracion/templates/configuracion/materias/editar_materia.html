{% extends 'principal/base.html' %}

{% block title %}Editar Materia{% endblock %}

{% block page_title %}Editar Materia{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary"><i class="fas fa-edit"></i> Editar Materia: {{ materia.NombreMateria }}</h6>
            </div>
            <div class="card-body">
                <form method="post" class="user">
                    {% csrf_token %}
                    <div class="form-group mb-3">
                        <label for="{{ form.NombreMateria.id_for_label }}">Nombre de la Materia</label>
                        {{ form.NombreMateria }}
                    </div>
                    <div class="form-group mb-3">
                        <label for="{{ form.NivelID.id_for_label }}">Nivel</label>
                        {{ form.NivelID }}
                    </div>
                    <div class="form-group form-check custom-control custom-checkbox mb-4">
                        <label class="form-check-label" for="{{ form.activo.id_for_label }}">{{ form.activo.label }}</label>
                        {{ form.activo }}
                    </div>
                    <hr>
                    <div class="d-flex justify-content-end">
                        <a href="{% url 'configuracion:listar_materias' %}" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-success"><i class="fas fa-sync-alt"></i> Actualizar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
