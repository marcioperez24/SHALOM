{% extends 'principal/base.html' %}
{% block title %}Confirmar Eliminación{% endblock %}
{% block content %}
    <div class="bg-white shadow-md rounded-lg p-6 max-w-lg mx-auto">
        <h1 class="text-2xl font-bold text-red-600 mb-4">Confirmar Eliminación</h1>
        <p class="text-gray-700 mb-6">¿Estás seguro de que deseas eliminar el grupo **{{ group.name }}**?</p>
        <p class="text-sm text-gray-500 mb-6">Esta acción no se puede deshacer.</p>
        
        <form method="post" action="{% url 'delete_group' group.id %}" class="flex space-x-4">
            {% csrf_token %}
            <button type="submit" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-300">
                Sí, eliminar
            </button>
            <a href="{% url 'group_list' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-4 rounded-lg transition duration-300">
                Cancelar
            </a>
        </form>
    </div>
{% endblock %}
