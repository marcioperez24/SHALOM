{% extends 'principal/base.html' %}
{% block title %}Acceso Docente{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="col-md-5">
            
            <div class="card shadow-lg border-0">
                
                <div class="card-header bg-success text-white text-center py-4">
                    <h4 class="mb-0 fw-bold">
                        <i class="fas fa-chalkboard-teacher me-2"></i>Acceso Docente
                    </h4>
                    <p class="small mb-0 text-white-50">Gestión de Clases y Notas</p>
                </div>

                <div class="card-body p-5">
                    
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger alert-dismissible fade show small mb-4" role="alert">
                                <i class="fas fa-exclamation-circle me-2"></i>{{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold text-success">Ingrese su No. Cédula</label>
                            
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-light text-success border-end-0">
                                    <i class="fas fa-id-card"></i>
                                </span>
                                <input type="text" name="cedula" class="form-control border-start-0 ps-0" 
                                       placeholder="Ej: 001-000000-0000U" required autofocus>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg fw-bold shadow-sm">
                                Ingresar al Panel <i class="fas fa-sign-in-alt ms-2"></i>
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{% url 'docentes_home' %}" class="text-decoration-none text-muted small">
                            <i class="fas fa-arrow-left me-1"></i> Volver al Inicio
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
